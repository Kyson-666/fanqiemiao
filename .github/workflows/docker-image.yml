name: Publish Docker image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  IMAGE_NAME: fanqiemiao

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # secrets 先注入 job 级 env，步骤级用 env 判断（直接引用 secrets 会报 Unrecognized named-value）
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KERNEL_VERSION=v2.4.15
            KERNEL_MIRROR=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          echo "运行镜像: $IMAGE"
          docker run -d --name fqm-smoke -p 18080:8080 "$IMAGE"

          echo "等待服务就绪（最多 180s）…"
          ok=0
          for i in $(seq 1 60); do
            sleep 3
            if curl -fsS -m 5 http://127.0.0.1:18080/api/status -o /tmp/status.json; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::服务在 180s 内未就绪"
            docker logs fqm-smoke || true
            docker rm -f fqm-smoke || true
            exit 1
          fi
          cat /tmp/status.json

          echo "校验番茄内核（关键回归项：容器内二进制必须能执行）…"
          node -e '
            const d = require("/tmp/status.json");
            console.log("kernel =", JSON.stringify(d.kernel));
            if (d.kernel.phase !== "ready") {
              console.error("::error::番茄内核未就绪，容器内内核二进制可能无法执行");
              process.exit(1);
            }
            console.log("OK: 内核 v" + d.kernel.version + " 已就绪");
          '

          echo "校验前端静态资源…"
          curl -fsS -m 10 http://127.0.0.1:18080/ | grep -q "番茄喵"
          curl -fsS -m 10 http://127.0.0.1:18080/app.js -o /dev/null
          curl -fsS -m 10 http://127.0.0.1:18080/style.css -o /dev/null
          echo "OK: 首页与静态资源正常"

          echo "=== 容器日志 ==="
          docker logs fqm-smoke 2>&1 | tail -20
          docker rm -f fqm-smoke

      - name: Summary
        run: |
          {
            echo "### Docker image published"
            echo ""
            echo "- \`ghcr.io/${{ github.repository }}\`"
            if [ -n "${{ env.DOCKERHUB_USERNAME }}" ]; then
              echo "- \`${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}\`"
            fi
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
